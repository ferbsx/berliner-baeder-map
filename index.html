<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berlin · offene Bäder & Anfahrt mit ÖPNV</title>
    <meta
      name="description"
      content="Welche Berliner Bäder gerade geöffnet sind, wie lange noch – und wie lange du mit Bus & Bahn hinkommst."
    />

    <!-- Leaflet (map) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__title">
        <h1>Berliner Bäder – jetzt offen</h1>
        <p class="topbar__sub">
          Geöffnete Bäder, Restöffnungszeit &amp; Anfahrt mit Bus &amp; Bahn.
        </p>
      </div>
      <div class="topbar__meta" id="freshness" aria-live="polite"></div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <section class="controls" aria-label="Suche">
          <div class="field">
            <label for="origin-input">Startpunkt</label>
            <div class="origin-row">
              <input
                id="origin-input"
                type="text"
                placeholder="Adresse oder Haltestelle…"
                autocomplete="off"
              />
              <button id="locate-btn" type="button" title="Meinen Standort verwenden">
                📍
              </button>
            </div>
            <div class="origin-status" id="origin-status">Standort wird ermittelt…</div>
          </div>

          <div class="field">
            <label>Zeitpunkt</label>
            <div class="seg" role="tablist">
              <button class="seg__btn is-active" id="mode-now" role="tab" aria-selected="true">
                Jetzt
              </button>
              <button class="seg__btn" id="mode-plan" role="tab" aria-selected="false">
                Planen
              </button>
            </div>
            <div class="plan-row" id="plan-row" hidden>
              <select id="plan-date" aria-label="Tag"></select>
              <input id="plan-time" type="time" value="14:00" step="900" aria-label="Uhrzeit" />
            </div>
          </div>
        </section>

        <div class="results-head">
          <span id="results-count">Lädt…</span>
          <span class="results-sort" id="results-sort"></span>
        </div>

        <ul class="pool-list" id="pool-list"></ul>

        <footer class="sidebar__foot">
          <p>
            Daten: <a href="https://www.berlinerbaeder.de/oeffnungszeiten-auf-einem-blick/" target="_blank" rel="noopener">Berliner Bäder-Betriebe</a>
            · Anfahrt: <a href="https://v6.vbb.transport.rest/" target="_blank" rel="noopener">VBB</a>
          </p>
          <p class="muted">
            Strandbäder &amp; Bäder mit abweichenden Eintrittspreisen (z.&nbsp;B. Strandbad
            Halensee) werden nicht angezeigt.
          </p>
        </footer>
      </aside>

      <div class="map-wrap">
        <div id="map"></div>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
